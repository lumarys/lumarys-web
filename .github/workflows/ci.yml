name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: testes
        run: npm test

      - name: conteúdo
        run: npm run content:lint

      - name: build
        run: npm run build

      # O perfil iPhone 15 usa WebKit (é o motor do Safari), então chromium
      # sozinho não cobre metade do público. Os dois entram.
      - name: navegadores para os testes de tela
        run: npx playwright install --with-deps chromium webkit

      - name: testes de tela (celular e desktop)
        run: npm run test:e2e

  conteudo-externo:
    name: vídeos e links
    runs-on: ubuntu-latest
    # Depende de serviço de terceiro: falha aqui é sinal de conteúdo que saiu
    # do ar, não de código quebrado, e por isso roda separado.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: vídeos ainda existem
        run: npm run verify:videos

      - name: artigos ainda respondem
        run: npm run verify:links

  seguranca:
    name: segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A ação oficial do gitleaks exige licença paga para organizações. O
      # binário é livre e faz o mesmo trabalho, então rodamos ele direto.
      - name: gitleaks
        run: |
          VERSAO=8.29.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # O endpoint de auditoria do npm cai com alguma frequência, e uma falha
      # de rede não pode ser lida como vulnerabilidade. Tentamos três vezes e
      # só reprovamos quando o npm realmente encontra algo.
      - name: auditoria de dependências
        run: |
          for tentativa in 1 2 3; do
            saida=$(npm audit --audit-level=high 2>&1) && { echo "$saida"; exit 0; }
            if echo "$saida" | grep -q "audit endpoint returned an error\|network timeout"; then
              echo "tentativa $tentativa: registro do npm indisponível, repetindo em 20s"
              sleep 20
              continue
            fi
            echo "$saida"
            exit 1
          done
          echo "::warning::não foi possível consultar o registro do npm em 3 tentativas"
