name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: testes
        run: npm test

      - name: conteúdo
        run: npm run content:lint

      - name: build
        run: npm run build

      - name: navegador para os testes de tela
        run: npx playwright install --with-deps chromium

      - name: testes de tela (celular e desktop)
        run: npm run test:e2e

  conteudo-externo:
    name: vídeos e links
    runs-on: ubuntu-latest
    # Depende de serviço de terceiro: falha aqui é sinal de conteúdo que saiu
    # do ar, não de código quebrado, e por isso roda separado.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: vídeos ainda existem
        run: npm run verify:videos

      - name: artigos ainda respondem
        run: npm run verify:links

  seguranca:
    name: segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A ação oficial do gitleaks exige licença paga para organizações. O
      # binário é livre e faz o mesmo trabalho, então rodamos ele direto.
      - name: gitleaks
        run: |
          VERSAO=8.29.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: auditoria de dependências
        run: npm audit --audit-level=high
